name: Build TV Extras

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build extras
        run: |
          chmod +x launcher/gradlew
          mkdir -p apks
          for addon in weather photo-screensaver; do
            chmod +x "addons/$addon/gradlew"
            (
              cd "addons/$addon"
              ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
            )
            cp "addons/$addon/app/build/outputs/apk/release/app-release.apk" "apks/$addon.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tv-extras
          path: apks/*.apk
          if-no-files-found: error
