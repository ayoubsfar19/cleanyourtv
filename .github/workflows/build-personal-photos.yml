name: Build Personal Photos
on:
  workflow_dispatch:
  push:
    paths:
      - "personal/photos/**"
      - ".github/workflows/build-personal-photos.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x launcher/gradlew personal/photos/gradlew
          personal/photos/gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: personal-photos-v1.3
          path: personal/photos/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
