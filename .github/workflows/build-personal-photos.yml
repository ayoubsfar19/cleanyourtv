name: Deliver Photos Football Preview
on:
  workflow_dispatch:
    inputs:
      bundle_base64:
        description: Public, signed preview ZIP (base64); never a signing key
        required: true
      bundle_sha256:
        description: SHA-256 of the tested ZIP
        required: true
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify tested public bundle
        env:
          BUNDLE_BASE64: ${{ inputs.bundle_base64 }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          python3 - <<'PY'
          import os,base64,hashlib,pathlib,zipfile
          raw=base64.b64decode(os.environ['BUNDLE_BASE64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==os.environ['BUNDLE_SHA256']
          path=pathlib.Path('photos-football-preview.zip')
          path.write_bytes(raw)
          with zipfile.ZipFile(path) as z:
              for name in ['photos-football-preview.apk','SHA256SUMS.txt']:
                  pathlib.Path(name).write_bytes(z.read(name))
          print('Tested bundle verified.')
          PY
      - name: Publish preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload photos-football-v2.0-preview photos-football-preview.zip photos-football-preview.apk SHA256SUMS.txt --clobber
          gh release edit photos-football-v2.0-preview --draft=false --prerelease
