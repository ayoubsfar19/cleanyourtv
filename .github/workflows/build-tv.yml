name: Build TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check configuration
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("launcher/app/src/main/res/values/config.xml")
          print("XML OK")
          PY

      - name: Build and check launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
